[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:fastapi]
command=uv run uvicorn backend.main:app --host 0.0.0.0 --port 8010
directory=/app
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=APP_ENV="%(ENV_APP_ENV)s",APP_DEBUG="%(ENV_APP_DEBUG)s",JWT_SECRET_KEY="%(ENV_JWT_SECRET_KEY)s",DATABASE_URL="%(ENV_DATABASE_URL)s",OPENROUTER_API_KEY="%(ENV_OPENROUTER_API_KEY)s",LOCAL_LLM_ENABLED="%(ENV_LOCAL_LLM_ENABLED)s",LOCAL_LLM_BASE_URL="%(ENV_LOCAL_LLM_BASE_URL)s",POSTGRES_MCP_HOST="%(ENV_POSTGRES_MCP_HOST)s",CALENDAR_MCP_HOST="%(ENV_CALENDAR_MCP_HOST)s",OTEL_EXPORTER_OTLP_ENDPOINT="%(ENV_OTEL_EXPORTER_OTLP_ENDPOINT)s",CORS_ORIGINS="%(ENV_CORS_ORIGINS)s"

[program:nextjs]
command=node server.js
directory=/app/frontend/.next/standalone
priority=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="3010",HOSTNAME="0.0.0.0"
