[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:mcp-postgres]
command=npx -y @modelcontextprotocol/server-postgres %(ENV_MCP_POSTGRES_URL)s
directory=/app
priority=15
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:mcp-google-calendar]
command=/bin/sh -c 'GOOGLE_CALENDAR_CLIENT_ID="$GOOGLE_CLIENT_ID" GOOGLE_CALENDAR_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" GOOGLE_CALENDAR_REFRESH_TOKEN="$GOOGLE_REFRESH_TOKEN" exec npx -y @franciscpd/calendar-mcp-server'
directory=/app
priority=16
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:fastapi]
command=uv run uvicorn backend.main:app --host 0.0.0.0 --port 8000
directory=/app
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nextjs]
command=node server.js
directory=/app/frontend/.next/standalone
priority=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT=3000,HOSTNAME=0.0.0.0
