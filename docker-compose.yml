services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8088:80"
    env_file:
      - .env
    environment:
      # Override local-dev CORS (3010/8010) so browser works on :8088 and hybrid :3010 → :8088
      CORS_ORIGINS: http://localhost,http://localhost:8088,http://127.0.0.1:8088,http://localhost:3010,http://127.0.0.1:3010
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  postgres:
    image: postgres:16-alpine
    profiles:
      - mcp
    environment:
      POSTGRES_USER: briefing
      POSTGRES_PASSWORD: briefing
      POSTGRES_DB: briefing
    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
