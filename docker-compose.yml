x-app-common: &app-common
  env_file:
    - .env
  environment:
    # Override local-dev CORS (3010/8010) so browser works on :8088 and hybrid :3010 → :8088
    CORS_ORIGINS: http://localhost,http://localhost:8088,http://127.0.0.1:8088,http://localhost:3010,http://127.0.0.1:3010
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  ports:
    - "8088:80"
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost/health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 90s

services:
  # Default — fast local build (no torch / LlamaFirewall; regex + constitutional layers still active)
  app:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_PROMPTGUARD: "false"

  # Production / security testing — installs LlamaFirewall + optional HF model preload
  app-promptguard:
    <<: *app-common
    profiles:
      - promptguard
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_PROMPTGUARD: "true"
        HF_TOKEN: ${HF_TOKEN:-}

  postgres:
    image: postgres:16-alpine
    profiles:
      - mcp
    environment:
      POSTGRES_USER: briefing
      POSTGRES_PASSWORD: briefing
      POSTGRES_DB: briefing
    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
