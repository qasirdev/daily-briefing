# Local observability stack for Daily Briefing development.
# Usage:
#   cd docs/guidence/observability
#   cp observability.env.example .env
#   # Edit .env — set PAGERDUTY_ROUTING_KEY and GRAFANA_ADMIN_PASSWORD
#   docker compose -f docker-compose.observability.yml up -d
#
# Requires: app running — Docker `docker compose up` (:8088) or uvicorn on :8010
# Docs: docs/guidence/observability/README.md

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: briefing-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml.template:ro
      - ../../../infrastructure/monitoring/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - ../../../infrastructure/alerting/rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    env_file:
      - .env
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed "s|\$${APP_METRICS_TARGET}|$${APP_METRICS_TARGET:-host.docker.internal:8088}|g" \
          /etc/prometheus/prometheus.yml.template > /etc/prometheus/prometheus.yml
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: briefing-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml.template:ro
      - ./config/alertmanager.no-pagerduty.yml:/etc/alertmanager/alertmanager.no-pagerduty.yml:ro
    env_file:
      - .env
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -n "$${PAGERDUTY_ROUTING_KEY}" ]; then
          sed -e "s|\$${PAGERDUTY_ROUTING_KEY}|$${PAGERDUTY_ROUTING_KEY}|g" \
              -e "s|\$${ALERT_ENV}|$${ALERT_ENV:-development}|g" \
            /etc/alertmanager/alertmanager.yml.template > /etc/alertmanager/alertmanager.yml
        else
          cp /etc/alertmanager/alertmanager.no-pagerduty.yml /etc/alertmanager/alertmanager.yml
        fi
        exec /bin/alertmanager \
          --config.file=/etc/alertmanager/alertmanager.yml \
          --storage.path=/alertmanager
    depends_on:
      - prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    platform: linux/arm64
    container_name: briefing-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
