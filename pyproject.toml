[project]
name = "daily-briefing"
version = "0.1.0"
description = "AI Daily Briefing Assistant — multi-agent orchestration with LangGraph"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.6.0",
    "langgraph>=0.4.0",
    "uvicorn[standard]>=0.32.0",
    "structlog>=24.4.0",
    "openai>=1.40.0",
    "httpx>=0.28.0",
    "nh3>=0.2.14",
    "tenacity>=9.0.0",
    "slowapi>=0.1.9",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29.0",
    "asyncpg>=0.31.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.18.4",
    "mcp>=1.27.2",
    "pgvector>=0.4.2",
    "pyyaml>=6.0.2",
    "rapidfuzz>=3.10.0",
]

[project.optional-dependencies]
promptguard = [
    "llamafirewall>=1.0.3",
    "huggingface-hub>=1.5.0,<2.0",
    "transformers>=5.0.0rc3",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.35.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.0",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "slowapi.*", "opentelemetry.*", "pgvector.*", "llamafirewall.*", "torch.*", "transformers.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
