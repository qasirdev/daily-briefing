name: Docker Publish

on:
  push:
    branches:
      - epic/autonomus-implementation
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish-and-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --all-extras --frozen

      - name: Deployment gates (production)
        env:
          APP_ENV: production
          APP_DEBUG: "false"
          # CI-only values that satisfy Settings validation; not used at runtime.
          JWT_SECRET_KEY: "ci-deployment-gate-check-only-not-a-production-secret-64chars!!"
          ADMIN_API_KEY: ci-deployment-gate-check
          LOCAL_LLM_ENABLED: "true"
        run: |
          uv run python -c "
          from backend.observability.deployment_gates import check_deployment_gates
          report = check_deployment_gates()
          print(report)
          if not report.all_pass:
              raise SystemExit(f'Deployment gates failed: {report}')
          print('All deployment gates passed')
          "

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "${tag}" ] && continue
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "${TAGS}"

      - name: Verify signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          first_tag=$(echo "${TAGS}" | head -n1 | tr -d ' ')
          cosign verify \
            --certificate-identity-regexp='.*' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
            "${first_tag}@${DIGEST}"
