groups:
  - name: daily-briefing-critical
    rules:
      - alert: HighErrorRate
        expr: daily_briefing:error_rate:5m > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Briefing error rate above 5%
          runbook: infrastructure/AGENT.md#higherrorrate

      - alert: SecurityViolationSpike
        expr: increase(security_violations_total[10m]) > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Security violation spike detected
          runbook: infrastructure/AGENT.md#securityviolationspike

  - name: daily-briefing-warning
    rules:
      - alert: HighLatency
        expr: daily_briefing:latency_p95:5m > 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Briefing P95 latency above 15s
          runbook: infrastructure/AGENT.md#highlatency

      - alert: DLQGrowing
        expr: increase(dlq_events_total[30m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: DLQ events growing quickly
          runbook: infrastructure/AGENT.md#dlqgrowing

  - name: daily-briefing-info
    rules:
      - alert: LocalLLMFallback
        expr: |
          sum(rate(llm_fallback_total[15m]))
          /
          clamp_min(sum(rate(llm_tokens_used_total[15m])), 1) > 0.10
        for: 15m
        labels:
          severity: info
        annotations:
          summary: Local LLM fallback rate above 10%
          runbook: infrastructure/AGENT.md#localllmfallback
